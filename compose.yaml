# Live-reloading docs server in a Linux container: `docker compose up`, then
# open http://localhost:8000/oscem-schemas/
#
# Generated docs are written to a Docker volume rather than the bind-mounted
# repo, because macOS/Windows filesystems are case-insensitive and pages that
# differ only in case (e.g. phaseplate.md and Phaseplate.md) would collide.
services:
  docs:
    build:
      context: .
      # Same Python and poetry.lock install as CI (.github/workflows/deploy-docs.yaml)
      dockerfile_inline: |
        FROM python:3.12-slim
        # gawk: the default mawk buffers input, delaying serve-live's log filter
        RUN apt-get update && apt-get install -y --no-install-recommends make gawk \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir --root-user-action=ignore poetry \
            && poetry config virtualenvs.create false
        COPY pyproject.toml poetry.lock /tmp/deps/
        RUN cd /tmp/deps && poetry install -E docs --no-root --no-interaction \
            && rm -rf /tmp/deps /root/.cache
        RUN useradd -m docsuser && mkdir -p /work/docs && chown docsuser /work/docs
        USER docsuser
    working_dir: /work
    volumes:
      - .:/work
      - docs:/work/docs
    ports:
      - "8000:8000"
    init: true
    command: make -j serve-live RUN= WATCH_ARGS=--debug-force-polling

volumes:
  docs:
