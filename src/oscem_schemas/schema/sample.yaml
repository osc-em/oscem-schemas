id: https://w3id.org/oscem-schemas/latest/sample
name: Sample
description: >
  LinkML schema for electron microscopy sample and author-related metadata,
  broadly following the EMDB standard with some additions.

prefixes:
  linkml: https://w3id.org/linkml/
  sample: https://w3id.org/oscem-schemas/latest/sample
  types: https://w3id.org/oscem-schemas/latest/custom_types
  pdbx: http://rdf.wwpdb.org/schema/pdbx-v50.owl#
  mmcif: https://mmcif.wwpdb.org/dictionaries/mmcif_pdbx_v50.dic/Items/

default_prefix: sample

imports:
  - linkml:types
  - ./custom_types


enums:
  MoleculeClassEnum:
    description: Allowed molecule class values - compatible with the EMDB.
    permissible_values:
      CELL:
        description: Cell
      COMPLEX:
        description: complex of different parts e.g. protein complex 
      ORGANELLE OR CELLULAR COMPONENT:
        description: Some form of cellular component
      RIBOSOME:
        description: A ribosome
      TISSUE:
        description: Tissue of any type.
      VIRUS:
        description: A virus particle - or part thereof.
  AssemblyEnum:
    description: Allowed molecular assembly values - compatible with the EMDB.
    permissible_values:
      FILAMENT:
        description: If your protein (complex) of interest is forming filaments
      HELICAL ARRAY: 
        description: If your protein (complex) of interest is forming helical arrays (i.e. tubes)
      PARTICLE:
        description: If your protein (complex) of interest forms individual particles on the grid with no orderd interactions

classes:

  Sample:
    description: Unifying class to describe the full sample.
    slots:
      - name
      - description
      - overall_molecule
      - molecule
      - ligands
      - specimen
      - grid
    slot_usage:
      name:
        required: true
      description:
        required: true
      overall_molecule:
        # alias: Overall_Molecule
        required: false
      molecule:
        # alias: Molecule
        required: false
      ligands:
        # alias: Ligands
      specimen:
        # alias: Specimen
        required: false
      grid:
        # alias: Grid

  OverallMolecule:
    description: Description of the overall molecule
    slots:
      - molecular_overall_type
      - name_sample
      - source
      - molecular_weight
      - assembly
    slot_usage:
      molecular_overall_type:
        required: false
      name_sample:
        # alias: Name
        required: true
      source:
        # alias: Source
        required: true
      molecular_weight:
        # alias: Molecular_weight
      assembly:
        required: false

  Molecule:
    description: More detailed information about individual molecules.
    slots:
      - name_mol
      - molecular_type
      - molecular_class
      - sequence
      - natural_source
      - taxonomy_id_source
      - expression_system
      - taxonomy_id_expression
      - gene_name
    slot_usage:
      name_mol:
        # alias: Name
        required: true
      molecular_type:
        required: false
      molecular_class:
        # alias: Class
        required: false
      sequence:
        # alias: Sequence
        required: true
      natural_source:
        # alias: Natural_source
        required: true
      taxonomy_id_source:
        # alias: Taxonomy_ID_source
        required: false
      expression_system:
        # alias: Expression_system
        required: false
      taxonomy_id_expression:
        # alias: Taxonomy_ID_expression
        required: false
      gene_name:
        # alias: Gene_name

  Ligand:
    description: Information on ligands if present.
    slots:
      - present
      - smiles
      - reference
    slot_usage:
      present:
        # alias: Present
        required: false

  Specimen:
    description: Description of specimen handling.
    slots:
      - buffer
      - concentration
      - ph
      - vitrification
      - vitrification_cryogen
      - humidity
      - temperature
      - staining
      - embedding
      - shadowing
    slot_usage:
      buffer:
        # alias: Buffer
      concentration:
        # alias: Concentration
      ph:
        # alias: pH
        required: false
      vitrification:
        # alias: Vitrification
        required: false
      vitrification_cryogen:
        # alias: Vitrification_cryogen
        required: false
      humidity:
        # alias: Humidity
      temperature:
        # alias: Temperature
      staining:
        # alias: Staining
        required: false
      embedding:
        # alias: Embedding
        required: false
      shadowing:
        # alias: Shadowing
        required: false

  Grid:
    description: Details on the grid used in the experiment.
    slots:
      - manufacturer
      - material
      - mesh
      - film_support
      - film_material
      - film_topology
      - film_thickness
      - pretreatment_type
      - pretreatment_time
      - pretreatment_pressure
      - pretreatment_atmosphere
    slot_usage:
      manufacturer:
        # alias: Manufacturer
      material:
        # alias: Material
      mesh:
        # alias: Mesh
      film_support:
        # alias: Film_support
      film_material:
        # alias: Film_material
      film_topology:
        # alias: Film_topology
      film_thickness:
        # alias: Film_thickness
      pretreatment_type:
        # alias: Pretreatment_type
      pretreatment_time:
        # alias: Pretreatment_time
      pretreatment_pressure:
        # alias: Pretreatment_pressure
      pretreatment_atmosphere:
        # alias: Pretreatment_atmosphere

  SampleMolecular:
    is_a: Sample
    slot_usage:
      name:
        required: false
      description:
        required: false
      overall_molecule:
        required: true


slots:
  molecular_type:
    description: Description of the overall molecular type, i.e., a complex
    range: string
    see_also:
      - mmcif:_entity_poly.type.html
    exact_mappings:
      - pdbx:entity_poly.type
  name_sample:
    description: Name of the full sample
    range: string
    see_also:
      - mmcif:_em_entity_assembly.name.html
    exact_mappings:
      - pdbx:em_entity_assembly.name
  source:
    description: Where the sample was taken from, i.e., natural host, recombinantly expressed, etc.
    range: string
    see_also:
      - mmcif:_entity.src_method.html
    exact_mappings:
      - pdbx:entity.src_method
  molecular_weight:
    description: Molecular weight in Da
    range:  QuantitySI
    see_also:
      - mmcif:_entity.formula_weight.html
    exact_mappings:
      - pdbx:entity.formula_weight
  molecular_overall_type:
    description: Description of the overall molecular type, i.e., a complex
    range: MoleculeClassEnum

  name_mol:
    description: Name of an individual molecule (often protein) in the sample
    range: string
    see_also:
      - mmcif:_pdbx_entity_branch_descriptor.descriptor.html
    exact_mappings:
      - pdbx:pdbx_entity_branch_descriptor.descriptor
  molecular_class:
    description: Class of the molecule
    range: string
  sequence:
    description: Full sequence of the sample as in the data, i.e., cleaved tags should also be removed from sequence here
    range: string
    see_also:
      - mmcif:_entity_poly.pdbx_seq_one_letter_code.html
    exact_mappings:
      - pdbx:entity_poly.pdbx_seq_one_letter_code
  natural_source:
    description: Scientific name of the natural host organism
    range: string
    see_also:
      - mmcif:_em_entity_assembly_naturalsource.organism.html
    exact_mappings:
      - pdbx:em_entity_assembly_naturalsource.organism
  taxonomy_id_source:
    description: Taxonomy ID of the natural source organism
    range: string
    see_also:
      - mmcif:_em_entity_assembly_naturalsource.ncbi_tax_id.html
    exact_mappings:
      - pdbx:em_entity_assembly_naturalsource.ncbi_tax_id
  expression_system:
    description: Scientific name of the organism used to produce the molecule of interest
    range: string
    see_also:
      - mmcif:_em_entity_assembly_recombinant.organism.html
    exact_mappings:
      - pdbx:em_entity_assembly_recombinant.organism
  taxonomy_id_expression:
    description: Taxonomy ID of the expression system organism
    range: string
    see_also:
      - mmcif:_em_entity_assembly_recombinant.ncbi_tax_id.html
    exact_mappings:
      - pdbx:em_entity_assembly_recombinant.ncbi_tax_id
  gene_name:
    description: Name of the gene of interest
    range: string
    see_also:
      - mmcif:_entity_src_gen.pdbx_gene_src_gene.html
    exact_mappings:
      - pdbx:entity_src_gen.pdbx_gene_src_gene

  present:
    description: Whether the model contains any ligands
    range: boolean
    see_also:
      - mmcif:_pdbx_entry_details.has_ligand_of_interest.html
    exact_mappings:
      - pdbx:pdbx_entry_details.has_ligand_of_interest
  smiles:
    description: Provide a valid SMILES string of your ligand
    range: string
    see_also:
      - mmcif:_pdbx_chem_comp_depositor_info.descriptor.html
    exact_mappings:
      - pdbx:pdbx_chem_comp_depositor_info.descriptor
  reference:
    description: Link to a reference of your ligand, i.e., CCD, PubChem, etc.
    range: string

  buffer:
    description: Name/composition of the (chemical) sample buffer during grid preparation
    range: string
    see_also:
      - mmcif:_em_buffer.details.html
    exact_mappings:
      - pdbx:em_buffer.details
  concentration:
    description: Concentration of the (supra)molecule in the sample, in mg/ml
    range:  QuantitySI
    see_also:
      - mmcif:_em_specimen.concentration.html
    exact_mappings:
      - pdbx:em_specimen.concentration
  ph:
    description: pH of the sample buffer
    range: float
    see_also:
      - mmcif:_em_buffer.pH.html
    exact_mappings:
      - pdbx:em_buffer.pH
  vitrification:
    description: Whether the sample was vitrified
    range: boolean
    see_also:
      - mmcif:_em_specimen.vitrification_applied.html
    exact_mappings:
      - pdbx:em_specimen.vitrification_applied
  vitrification_cryogen:
    description: Which cryogen was used for vitrification
    range: string
    see_also:
      - mmcif:_em_vitrification.cryogen_name.html
    exact_mappings:
      - pdbx:em_vitrification.cryogen_name
  humidity:
    description: Environmental humidity just before vitrification, in %
    range:  QuantitySI
    see_also:
      - mmcif:_em_vitrification.humidity.html
    exact_mappings:
      - pdbx:em_vitrification.humidity
  temperature:
    description: Environmental temperature just before vitrification, in K
    range:  QuantitySI
    see_also:
      - mmcif:_em_vitrification.chamber_temperature.html
    exact_mappings:
      - pdbx:em_vitrification.chamber_temperature
  staining:
    description: Whether the sample was stained
    range: boolean
    see_also:
      - mmcif:_em_specimen.staining_applied.html
    exact_mappings:
      - pdbx:em_specimen.staining_applied
  embedding:
    description: Whether the sample was embedded
    range: boolean
    see_also:
      - mmcif:_em_specimen.embedding_applied.html
    exact_mappings:
      - pdbx:em_specimen.embedding_applied
  shadowing:
    description: Whether the sample was shadowed
    range: boolean
    see_also:
      - mmcif:_em_specimen.shadowing_applied.html
    exact_mappings:
      - pdbx:em_specimen.shadowing_applied

  material:
    description: Material out of which the grid is made
    range: string
    see_also:
      - mmcif:_em_sample_support.grid_material.html
    exact_mappings:
      - pdbx:em_sample_support.grid_material
  mesh:
    description: Grid mesh in lines per inch
    range: float
    see_also:
      - mmcif:_em_sample_support.grid_mesh_size.html
    exact_mappings:
      - pdbx:em_sample_support.grid_mesh_size
  film_support:
    description: Whether a support film was used
    range: boolean
  film_material:
    description: Type of material the support film is made of
    range: string
    see_also:
      - mmcif:_em_support_film.material.html
    exact_mappings:
      - pdbx:em_support_film.material
  film_topology:
    description: Topology of the support film
    range: string
    see_also:
      - mmcif:_em_support_film.topology.html
    exact_mappings:
      - pdbx:em_support_film.topology
  film_thickness:
    description: Thickness of the support film
    range: string
    see_also:
      - mmcif:_em_support_film.thickness.html
    exact_mappings:
      - pdbx:em_support_film.thickness
  pretreatment_type:
    description: Type of pretreatment of the grid, i.e., glow discharge
    range: string
    see_also:
      - mmcif:_em_grid_pretreatment.type.html
    exact_mappings:
      - pdbx:em_grid_pretreatment.type
  pretreatment_time:
    description: Length of time of the pretreatment in s
    range:  QuantitySI
    see_also:
      - mmcif:_em_grid_pretreatment.time.html
    exact_mappings:
      - pdbx:em_grid_pretreatment.time
  pretreatment_pressure:
    description: Pressure of the chamber during pretreatment, in Pa
    range:  QuantitySI
    see_also:
      - mmcif:_em_grid_pretreatment.pressure.html
    exact_mappings:
      - pdbx:em_grid_pretreatment.pressure
  pretreatment_atmosphere:
    description: Atmospheric conditions in the chamber during pretreatment, i.e., addition of specific gases, etc.
    range: string
    see_also:
      - mmcif:_em_grid_pretreatment.atmosphere.html
    exact_mappings:
      - pdbx:em_grid_pretreatment.atmosphere

  overall_molecule:
    description: Description of the overall molecule
    range: OverallMolecule
  molecule:
    description: List of molecule associated with the sample
    range: Molecule
    multivalued: true
  ligands:
    description: List of ligands associated with the sample
    range: Ligand
    multivalued: true
  specimen:
    description: Description of the specimen
    range: Specimen
  grid:
    description: Description of the grid used
    range: Grid
  assembly:
    description: What type of higher order structure your sample forms - if any.
    range: AssemblyEnum
    see_also:
      - mmcif:_em_experiment.aggregation_state.html
    exact_mappings:
      - pdbx:em_experiment.aggregation_state
